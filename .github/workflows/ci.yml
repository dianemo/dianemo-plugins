name: CI

on:
  push:
    branches: [master]
  pull_request:
  # create-release-pr.yml starts this on the release branch, whose push — made
  # with the built-in token — starts no workflows of its own.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Build first: every plugin imports @dianemo/plugin-kit, whose `types`
      # field points into its dist, so `check` cannot resolve it on a fresh
      # checkout until the kit has been built.
      - name: Build
        run: npm run build

      - name: Verify
        run: |
          npm run sort-imports:check
          npm run format
          npm run lint
          npm run check
          npm test

  # The suite above loads each plugin from packages/<name>/src, which never
  # consults package.json — so the exports map, the files list and the emitted
  # dist go unexercised. Consumers use nothing else. This packs the workspaces
  # and drives the tarballs by bare specifier against @dianemo/core from npm.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify packed packages
        run: npm run verify:pack

      # Setup examples are documentation that claims to compile, so it has to.
      - name: Verify README examples
        run: npm run verify:readme
