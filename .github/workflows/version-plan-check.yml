name: Version Plan Check

on:
  pull_request:
    branches: [master]

jobs:
  check-version-plan:
    name: Version plans cover touched packages
    # A release PR consumes the plans while bumping every package it releases,
    # so this check could only fail there. docs/releasing.md names the branch.
    if: ${{ !startsWith(github.head_ref, 'chore/release-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Ask Nx — not a path grep — whether a plan is required. Only files
      # under packages/ count, less the patterns nx.json ignores, so touching
      # docs, tests, scripts or CI does not demand one.
      - name: Check version plans
        run: npx nx release plan:check --base=origin/master --head=HEAD
